name: Build desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            platform: mac-arm64
          - target: darwin-x64
            runner: macos-15-intel
            platform: mac-x64
          - target: win32-x64
            runner: macos-15
            platform: win-x64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - run: ./scripts/package-native.sh test
      - id: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ./scripts/package-native.sh "$TARGET"
          printf 'version=%s\n' "$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/release-${{ steps.package.outputs.version }}/Tock-${{ steps.package.outputs.version }}-${{ matrix.platform }}.zip
          if-no-files-found: error
          archive: false
